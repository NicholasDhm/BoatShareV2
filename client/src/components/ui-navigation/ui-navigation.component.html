<!-- Modern Navigation with improved accessibility and design -->
<nav class="navbar navbar-expand-lg" role="navigation" aria-label="Main navigation">
  <div class="container-fluid">
    <!-- Brand/Logo -->
    <a class="navbar-brand" routerLink="/dashboard" aria-label="BoatShare - Go to dashboard">
      <i class="bi bi-sailboat me-2" aria-hidden="true"></i>
      <span>BoatShare</span>
    </a>

    <!-- Mobile toggle button - only show when logged in -->
    @if (role !== 'Unknown') {
      <button
        class="navbar-toggler"
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen"
        [class.active]="isMenuOpen"
        aria-controls="navbarNav"
        aria-label="Toggle navigation">
        <span class="hamburger-icon">
          <span class="line"></span>
          <span class="line"></span>
          <span class="line"></span>
        </span>
      </button>
    }

    <!-- Navigation Links -->
    <div class="collapse navbar-collapse"
         [ngClass]="{'show': isMenuOpen}"
         id="navbarNav">
      <ul class="navbar-nav me-auto" role="menubar">
        @if (role !== 'Unknown') {
          <!-- Dashboard -->
          <li class="nav-item" role="none">
            <a
              class="nav-link"
              routerLink="/dashboard"
              routerLinkActive="active"
              (click)="closeMenu()"
              role="menuitem"
              aria-label="Go to dashboard">
              <i class="bi bi-house-door me-1" aria-hidden="true"></i>
              Início
            </a>
          </li>

          <!-- Profile -->
          <li class="nav-item" role="none">
            <a
              class="nav-link"
              routerLink="/profile"
              routerLinkActive="active"
              (click)="closeMenu()"
              role="menuitem"
              aria-label="View profile">
              <i class="bi bi-person me-1" aria-hidden="true"></i>
              Perfil
            </a>
          </li>

          <!-- History -->
          <li class="nav-item" role="none">
            <a
              class="nav-link"
              routerLink="/history"
              routerLinkActive="active"
              (click)="closeMenu()"
              role="menuitem"
              aria-label="View history">
              <i class="bi bi-clock-history me-1" aria-hidden="true"></i>
              Histórico
            </a>
          </li>

          <!-- Admin Section -->
          @if (role === 'Admin') {
            <li class="nav-item dropdown" role="none">
              <a
                class="nav-link dropdown-toggle"
                (click)="toggleAdminDropdown(); $event.preventDefault()"
                [class.show]="isAdminDropdownOpen"
                href="#"
                id="adminDropdown"
                role="menuitem"
                [attr.aria-expanded]="isAdminDropdownOpen"
                aria-haspopup="true"
                aria-label="Admin options">
                <i class="bi bi-gear me-1" aria-hidden="true"></i>
                Administração
              </a>
              <ul class="dropdown-menu"
                  [class.show]="isAdminDropdownOpen"
                  aria-labelledby="adminDropdown"
                  role="menu">
                <li role="none">
                  <a
                    class="dropdown-item"
                    routerLink="/admin/users"
                    (click)="closeAdminDropdown()"
                    role="menuitem"
                    aria-label="Manage users">
                    <i class="bi bi-people me-2" aria-hidden="true"></i>
                    Usuários
                  </a>
                </li>
                <li role="none">
                  <a
                    class="dropdown-item"
                    routerLink="/admin/boats"
                    (click)="closeAdminDropdown()"
                    role="menuitem"
                    aria-label="Manage boats">
                    <i class="bi bi-sailboat me-2" aria-hidden="true"></i>
                    Barcos
                  </a>
                </li>
                <li role="none">
                  <hr class="dropdown-divider">
                </li>
                <li role="none">
                  <a
                    class="dropdown-item"
                    (click)="closeAdminDropdown(); $event.preventDefault()"
                    href="#"
                    role="menuitem"
                    aria-label="View analytics">
                    <i class="bi bi-graph-up me-2" aria-hidden="true"></i>
                    Relatórios
                    <small class="text-muted ms-1">(Em breve)</small>
                  </a>
                </li>
              </ul>
            </li>
          }
        } @else {
          <!-- Public navigation for non-authenticated users -->
          <li class="nav-item" role="none">
            <a 
              class="nav-link" 
              routerLink="/login" 
              routerLinkActive="active"
              role="menuitem"
              aria-label="Sign in to your account">
              <i class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></i>
              Entrar
            </a>
          </li>
        }
      </ul>

      <!-- Right side actions -->
      <div class="navbar-nav">
        @if (role === 'Unknown') {
          <a
            class="btn btn-primary nav-cta"
            routerLink="/register"
            aria-label="Create new account">
            <i class="bi bi-person-plus me-1" aria-hidden="true"></i>
            Criar Conta
          </a>
        }
      </div>
    </div>
  </div>
</nav>
