@if (user) {
  <div class="quotas">
    @for (quota of quotaCards; track quota.key) {
      <button
        type="button"
        class="quota"
        [attr.data-type]="quota.key"
        tabindex="0"
        data-bs-trigger="focus"
        [attr.data-bs-toggle]="quota.key + '-state-popover'"
        [attr.data-bs-title]="quota.title"
        [attr.data-bs-content]="quota.content">
        <span class="quota__top">
          <span class="series-dot" [ngClass]="'series-dot--' + quota.key"></span>
          <i class="bi bi-info-circle quota__info" aria-hidden="true"></i>
        </span>
        <span class="quota__value">{{ quota.value }}</span>
        <span class="quota__label">{{ quota.label }}</span>
      </button>
    }
  </div>
}
